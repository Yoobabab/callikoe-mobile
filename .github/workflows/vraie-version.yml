# Construit la vraie version de l'appli (sonnerie du système, appels appli fermée) sur les serveurs d'Expo.
# À lancer à la main : onglet Actions › « Construire la vraie version » › Run workflow (quelques minutes GitHub seulement :
# la construction elle-même se fait chez Expo, le lien de téléchargement apparaît sur expo.dev › Builds).
name: Construire la vraie version

on:
  workflow_dispatch:
    inputs:
      plateforme:
        description: "android (fichier APK à installer) ou ios (compte Apple nécessaire)"
        required: true
        default: android
        type: choice
        options: [android, ios]
      profil:
        description: "apk (normal), dev (version de développement, pour chercher un problème) ou store (iPhone : envoyée sur TestFlight / App Store)"
        required: true
        default: apk
        type: choice
        options: [apk, dev, store]

jobs:
  construire:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier le code
        run: npx tsc --noEmit
      # Clé App Store Connect (secrets ASC_API_KEY, ASC_KEY_ID, ASC_ISSUER_ID, ajoutés par le propriétaire) : Expo crée lui-même
      # les certificats iPhone et envoie la version sur TestFlight. Le fichier de la clé n'existe que le temps de ce lancement.
      - name: Clé App Store Connect
        if: inputs.plateforme == 'ios'
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          [ -n "$ASC_API_KEY" ] || { echo "::error::Secret ASC_API_KEY manquant (clé .p8 d'App Store Connect)"; exit 1; }
          printf '%s\n' "$ASC_API_KEY" > "$RUNNER_TEMP/asc.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"
      - name: Lancer la construction chez Expo (sans attendre la fin)
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: A67K4V32H6
        run: |
          SUBMIT=""; [ "${{ inputs.profil }}" = "store" ] && SUBMIT="--auto-submit-with-profile=store"
          npx --yes eas-cli build --platform "${{ inputs.plateforme }}" --profile "${{ inputs.profil }}" $SUBMIT --non-interactive --no-wait
