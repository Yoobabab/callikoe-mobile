# Publie automatiquement chaque nouvelle version de l'appli sur Expo,
# pour l'ouvrir dans Expo Go sur iPhone ou Android (même méthode que les autres applis).
name: Publier dans Expo Go

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publier
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Vérifier la clé Expo
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Il manque le secret EXPO_TOKEN dans les réglages du dépôt (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Préparer le rapport d'erreurs
        run: |
          cat > "$RUNNER_TEMP/etape.sh" <<'EOS'
          titre="$1"; shift
          if ! "$@" > "$RUNNER_TEMP/sortie.txt" 2>&1; then
            cat "$RUNNER_TEMP/sortie.txt"
            echo "::error title=$titre::$(tail -c 900 "$RUNNER_TEMP/sortie.txt" | tr '\n' ' ' | tr -s ' ')"
            exit 1
          fi
          cat "$RUNNER_TEMP/sortie.txt"
          EOS
          chmod +x "$RUNNER_TEMP/etape.sh"
      - name: Installer les dépendances
        run: $RUNNER_TEMP/etape.sh "Installation" npm ci
      - name: Installer EAS
        run: $RUNNER_TEMP/etape.sh "Installation EAS" npm install --global eas-cli
      - name: Vérifier le code
        run: $RUNNER_TEMP/etape.sh "Vérification du code" npx tsc --noEmit
      - name: Relier le projet au compte Expo (première fois seulement)
        run: |
          if ! node -e "process.exit(require('./app.json').expo?.extra?.eas?.projectId ? 0 : 1)"; then
            $RUNNER_TEMP/etape.sh "Création du projet Expo" eas init --non-interactive --force
          fi
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json"));
            const id = a.expo.extra.eas.projectId;
            a.expo.updates = { ...(a.expo.updates || {}), url: "https://u.expo.dev/" + id };
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2) + "\n");
          '
      - name: Publier la mise à jour
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Publication manuelle' }}
        run: |
          TITRE=$(echo "$MESSAGE" | head -n 1)
          $RUNNER_TEMP/etape.sh "Publication" eas update --branch main --message "$TITRE" --non-interactive
      - name: Enregistrer l'identifiant du projet Expo
        run: |
          if ! git diff --quiet app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "Relie le projet au compte Expo [skip ci]"
            git push
          fi
