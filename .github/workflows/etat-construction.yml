# Affiche l'état des dernières constructions chez Expo (1 minute GitHub environ).
name: État de la construction

on:
  workflow_dispatch:

jobs:
  etat:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Dernières constructions
        run: npx --yes eas-cli build:list --limit 3 --non-interactive --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{for(const b of JSON.parse(d))console.log("::notice title=Construction::"+[b.platform,b.buildProfile,b.status,b.error?.message||"",b.artifacts?.buildUrl||b.artifacts?.applicationArchiveUrl||"",b.logFiles?.[0]||""].join(" | "))})'
